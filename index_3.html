<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEM Launch 8th Grade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The 8th grade team at STEM Launch: weekly updates, dates, class info, and resources for students and families.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mission-control dark. Sticky top bar, one hero band with a launch countdown,
   then stacked content bands on a deep-space ground. Subject colors code every class. */
:root{
  color-scheme: dark;
  --space:#08132B; --space-2:#0C1A3A; --panel:#11234C; --panel-2:#162C5C; --line:#24396E;
  --ink:#EEF2FF; --muted:#A6B4DA; --faint:#7385B5;
  --ignite:#FF6B3D; --ignite-2:#FF9A6B; --on-ignite:#1C0802;
  --c-ela:#FF8FB1; --c-social:#F5C451; --c-science:#7EE08F;
  --c-engineering:#4FD6C8; --c-math:#6FA8FF; --c-accel:#B99BFF;
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:14px; --wrap:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--space);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--space)}
a{color:var(--ink)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ignite);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-stretch:125%;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-weight:850;font-size:clamp(2.4rem,6.4vw,4.6rem)}
h2{font-weight:800;font-size:clamp(1.5rem,3vw,2.1rem)}
h3{font-weight:750;font-size:1.15rem;letter-spacing:0}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(40px,6vw,72px)}
.band + .band{padding-top:0}
.eyebrow{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lede{color:var(--muted);font-size:1.08rem;max-width:62ch}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.sec-head .eyebrow{display:block;margin-bottom:8px}
.more{font-family:var(--font-mono);font-size:.85rem;color:var(--ignite-2);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--space) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--font-display);font-stretch:125%;font-weight:850;font-size:1.05rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.nav{margin-left:auto;display:flex;gap:2px;list-style:none;padding:0;margin-block:0}
.nav a{display:block;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
.nav a:hover{color:var(--ink);background:var(--panel)}
.nav a[aria-current="page"]{color:var(--on-ignite);background:var(--ignite)}
.menu-btn{display:none;margin-left:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:600 .9rem var(--font-body);cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--space-2);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav a{padding:12px 14px;font-size:1.05rem}
}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(120% 90% at 85% 0%,var(--space-2),var(--space) 70%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .arc{position:absolute;right:-6%;bottom:-30%;width:min(760px,90vw);opacity:.9;pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:clamp(48px,7vw,96px)}
.hero h1 span{color:var(--ignite)}
.hero .lede{margin-top:18px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--panel)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ignite);border-color:var(--ignite);color:var(--on-ignite)}
.btn.primary:hover{background:var(--ignite-2)}
.countdown{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px}
.countdown .t{font-family:var(--font-mono);font-weight:600;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;color:var(--ignite);font-variant-numeric:tabular-nums}
.countdown .t small{font-size:.4em;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.countdown h3{font-size:1.3rem}
.countdown .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.92rem}
.countdown hr{border:0;border-top:1px dashed var(--line);margin:0}
.next-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.next-list li{display:flex;gap:12px;align-items:baseline;font-size:.92rem;color:var(--muted)}
.next-list .mono{color:var(--ink);min-width:5.2em}
@media (max-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px dashed var(--faint);color:var(--muted)}
.c-ela{--c:var(--c-ela)} .c-social{--c:var(--c-social)} .c-science{--c:var(--c-science)}
.c-engineering{--c:var(--c-engineering)} .c-math{--c:var(--c-math)} .c-accel{--c:var(--c-accel)} .c-team{--c:var(--ignite-2)}

.notice{border:1px solid color-mix(in srgb,var(--ignite) 50%,var(--line));background:color-mix(in srgb,var(--ignite) 10%,var(--space));border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.notice b{color:var(--ignite-2);font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;padding-top:2px}
.announce{padding-block:20px 0}

/* grids */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0;display:flex;flex-direction:column;gap:10px}
a.card{text-decoration:none;color:var(--ink);transition:transform .15s ease,border-color .15s ease}
a.card:hover{transform:translateY(-2px);border-color:var(--c,var(--ignite))}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .who{color:var(--muted);font-size:.9rem}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.empty{color:var(--faint);font-style:italic}
.txt p + p{margin-top:.6em}
.txt a{color:var(--ignite-2)}

/* date strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.strip > *{scroll-snap-align:start}
.date-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.cal{width:56px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--space)}
.cal .m{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;background:var(--ignite);color:var(--on-ignite);padding:3px 0;font-weight:600}
.cal .d{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:1.5rem;padding:4px 0 2px;line-height:1.1}
.cal .w{font-family:var(--font-mono);font-size:.64rem;color:var(--muted);padding-bottom:4px;letter-spacing:.08em}
.date-card h3{font-size:1rem;line-height:1.25;font-stretch:110%}
.date-card .sub{font-size:.85rem;color:var(--muted);margin-top:6px}
.date-card .chip{white-space:normal}
.date-card .t{font-family:var(--font-mono);font-size:.78rem;color:var(--ignite-2);margin-top:8px;display:block}

/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.person{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:1.05rem;color:var(--space);background:var(--c);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person .n{font-weight:600}
.person .s{font-size:.85rem;color:var(--muted)}
.email{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.email span{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.copy{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:500 .7rem var(--font-mono);padding:2px 6px;cursor:pointer;flex-shrink:0}
.copy:hover{color:var(--ink);border-color:var(--muted)}

/* feature */
.feature{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.atom{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
.atom svg.orbit{position:absolute;right:-40px;top:-40px;width:240px;opacity:.55;pointer-events:none}
.atom h2{position:relative}
.atom .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
@media (max-width:820px){.feature{grid-template-columns:minmax(0,1fr)}}

/* page header */
.page-head{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--space-2),var(--space))}
.page-head .wrap{padding-block:clamp(36px,5vw,60px);display:grid;gap:12px}
.page-head h1{font-size:clamp(2rem,5vw,3.4rem)}
.page-head h1 .accent{color:var(--c,var(--ignite))}

/* updates */
.upd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;border-top:1px solid var(--line);padding-top:12px}
.upd .lbl{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
@media (max-width:640px){.upd{grid-template-columns:minmax(0,1fr)}}

/* class page */
.class-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.class-layout{grid-template-columns:minmax(0,1fr)}}
.units{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:u}
.units li{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--space-2);border:1px solid var(--line)}
.units li::before{counter-increment:u;content:counter(u,decimal-leading-zero);font-family:var(--font-mono);font-size:.8rem;color:var(--c,var(--ignite))}
.units.plain{counter-reset:none}
.units.plain li{grid-template-columns:minmax(0,1fr)}
.units.plain li::before{display:none}
.stack{display:grid;gap:16px}
.hl h3{font-size:1.02rem;font-stretch:112%}
.hl p{color:var(--muted);font-size:.95rem}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res-list a{display:block;padding:12px 14px;border-radius:10px;background:var(--space-2);border:1px solid var(--line);text-decoration:none}
.res-list a:hover{border-color:var(--ignite)}
.res-list b{display:block;font-weight:600}
.res-list span{font-size:.85rem;color:var(--muted)}

/* calendar */
.month{display:grid;gap:10px}
.month + .month{margin-top:32px}
.month h2{font-size:1.2rem;color:var(--muted);font-stretch:112%}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.agenda li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.agenda .when{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);line-height:1.3}
.agenda .when b{display:block;color:var(--ink);font-size:1.05rem}
.agenda .what b{font-weight:600}
.agenda .what p{font-size:.9rem;color:var(--muted)}
.agenda .in{font-family:var(--font-mono);font-size:.8rem;color:var(--ignite-2);white-space:nowrap}
@media (max-width:560px){.agenda li{grid-template-columns:64px minmax(0,1fr)}.agenda .in{grid-column:2}}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.95rem}
th{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500;background:var(--space-2)}
tr:last-child td{border-bottom:0}
td .mono{font-size:.85rem;color:var(--muted);user-select:all}

/* gallery */
.gallery{columns:3 260px;column-gap:16px}
.gallery figure{break-inside:avoid;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{padding:12px 14px;display:grid;gap:6px;font-size:.92rem;color:var(--muted)}
.story{padding:0}
.story .art{height:120px;background:var(--space-2);border-bottom:1px solid var(--line);display:block;width:100%}
.story .body{padding:16px;display:grid;gap:8px}

footer{border-top:1px solid var(--line);margin-top:24px}
footer .wrap{padding-block:32px;display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;color:var(--muted);font-size:.9rem}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

function fallYear(){const d=new Date();return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1}
function parseDate(s){
  s = String(s||"").trim(); if(!s) return null; let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/))){
    let y = m[3]? +m[3] : null; if(y!==null && y<100) y+=2000;
    if(y===null){ const fy=fallYear(); y = (+m[1]>=7)?fy:fy+1; }
    return new Date(y,+m[1]-1,+m[2]);
  }
  const d = new Date(s); if(!isNaN(d)){d.setHours(0,0,0,0);return d} return null;
}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const head = rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  return rows.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}
async function loadTab(name, mustHave){
  const url=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.SHEET_ID)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r = await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(name+": "+r.status);
  const rows = parseCSV(await r.text());
  // Google returns the first tab when a tab name is missing, so check the columns.
  if(rows.length && !mustHave.every(k=>k in rows[0])) return null;
  return rows;
}
async function loadSheet(){

  if(ga){ any=true; DATA.gallery = ga.map(r=>({img:driveImg(r.photo_link),caption:r.caption,cls:classKey(r.class)})).filter(x=>x.img); }
  if(an){ any=true; const m = an.find(r=>r.message && !/^(no|n|false)$/i.test(r.show||"yes")); DATA.announcement = m?m.message:""; }

  const tile = r=>`<a class="card c-${r.cls}" href="${esc(r.url)}" target="_blank" rel="noopener"><div class="row">${chip(r.cls)}<span aria-hidden="true">↗</span></div><h3>${esc(r.title)}</h3><p style="color:var(--muted);font-size:.95rem">${esc(r.desc)}</p></a>`;
  return pageHead("Help, practice & tools","Resources","The links students and families use most, in one place.")+
  `<section class="band"><div class="wrap stack" style="gap:32px">
    ${atomPanel()}
    <div><div class="sec-head"><h2>Practice & help</h2></div><div class="grid g3">${general.map(tile).join("")}</div></div>
    ${byClass.map(g=>`<div><div class="sec-head"><h2>${esc(CLASSES[g.k].name)}</h2></div><div class="grid g3">${g.list.map(tile).join("")}</div></div>`).join("")}
  </div></section>`;
}
const STORY_ART = {
  engineering:'<svg class="art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#4FD6C8" stroke-width="1.5" opacity=".8"><path d="M60 30l26 15v30l-26 15-26-15V45z"/><path d="M112 30l26 15v30l-26 15-26-15V45z"/><path d="M164 30l26 15v30l-26 15-26-15V45z" fill="#4FD6C8" fill-opacity=".18"/><path d="M216 30l26 15v30l-26 15-26-15V45z"/><path d="M268 30l26 15v30l-26 15-26-15V45z"/></g></svg>',
  science:'<svg class="art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#7EE08F" stroke-width="1.5"><circle cx="150" cy="60" r="22" fill="#7EE08F" fill-opacity=".18"/><circle cx="150" cy="60" r="40" opacity=".5"/><circle cx="150" cy="60" r="58" opacity=".3"/><circle cx="150" cy="60" r="76" opacity=".15"/></g></svg>',
  social:'<svg class="art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#F5C451" stroke-width="1.5"><rect x="90" y="22" width="70" height="86" rx="3" opacity=".5" transform="rotate(-6 125 65)"/><rect x="130" y="16" width="70" height="86" rx="3" fill="#F5C451" fill-opacity=".14"/><path d="M142 36h46M142 48h46M142 60h30" opacity=".7"/></g></svg>'
};
function viewGallery(){
  const photos = DATA.gallery.map(g=>`<figure class="c-${g.cls}"><img src="${esc(g.img)}" alt="${esc(g.caption||"Class photo")}" loading="lazy"><figcaption>${chip(g.cls)}<span>${esc(g.caption)}</span></figcaption></figure>`).join("");
  const stories = ["engineering","science","social"].flatMap(k=>CLASSES[k].highlights.map(h=>({k,...h})));
  return pageHead("Projects & highlights","Gallery","What 8th graders are building, testing, and arguing about.")+
  `<section class="band"><div class="wrap">
    ${photos?`<div class="gallery">${photos}</div>`:`<div class="notice" style="margin-bottom:24px"><b>Photos</b><p>Class photos appear here as teachers add them to the team sheet. Until then, here's what's been happening.</p></div>`}
    <div class="sec-head" style="margin-top:${photos?"40px":"0"}"><h2>Project highlights</h2></div>
    <div class="gallery">${stories.map(s=>`<figure class="story c-${s.k}">${STORY_ART[s.k]||""}<div class="body">${chip(s.k)}<h3 style="font-size:1.05rem;font-stretch:112%">${esc(s.t)}</h3><p style="color:var(--muted);font-size:.93rem">${esc(s.d)}</p></div></figure>`).join("")}</div>
  </div></section>`;
}

/* ---------- router ---------- */
const ROUTES = {home:viewHome,updates:viewUpdates,classes:viewClasses,calendar:viewCalendar,resources:viewResources,gallery:viewGallery};
function route(){ const h=(location.hash||"#home").slice(1); return (h in ROUTES || h in CLASSES)?h:"home"; }
function render(scroll){
  const r=route();
  $("#app").innerHTML = r in CLASSES ? viewClass(r) : ROUTES[r]();
  const navKey = r in CLASSES ? "classes" : r;
  document.querySelectorAll(".nav a").forEach(a=>{ if(a.getAttribute("href")==="#"+navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.title = (r==="home"?"":(CLASSES[r]?.name || {updates:"Weekly Updates",classes:"Classes",calendar:"Dates",resources:"Resources",gallery:"Gallery"}[r])+" · ")+"STEM Launch 8th Grade";
  if(scroll) window.scrollTo(0,0);
  drawStars();
}
window.addEventListener("hashchange",()=>{ $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); render(true); });
$("#menuBtn").addEventListener("click",e=>{const o=$("#nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",String(o))});
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  const v=b.dataset.copy;
  try{ await navigator.clipboard.writeText(v); b.textContent="Copied"; }
  catch{ const s=b.previousElementSibling; if(s){const rg=document.createRange();rg.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);} b.textContent="Selected"; }
  setTimeout(()=>b.textContent="Copy",1600);
});

/* ---------- starfield ---------- */
function drawStars(){
  const c=$("#stars"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=r.width*dpr; c.height=r.height*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  let s=42; const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  const n=Math.round(r.width*r.height/5200);
  for(let i=0;i<n;i++){ const a=rnd(); x.fillStyle=a>.94?"rgba(255,154,107,.9)":`rgba(214,224,255,${.2+rnd()*.55})`; x.beginPath(); x.arc(rnd()*r.width,rnd()*r.height,a>.97?1.6:rnd()*1.1+.2,0,7); x.fill(); }
}
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawStars,150)});

render(false);
loadSheet().catch(err=>console.warn("Team sheet not loaded:",err));
</script>
