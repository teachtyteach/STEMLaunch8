<!doctype html>
<html lang="en">

<meta charset="utf-8">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:site_name" content="STEM Launch 8th Grade">
<meta property="og:title" content="8th Grade at STEM Launch">
<meta property="og:description" content="Weekly updates, upcoming dates, teachers, and resources for STEM Launch 8th grade families.">
<meta property="og:url" content="https://stem8.org/">
<meta property="og:image" content="https://stem8.org/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<title>STEM Launch 8th Grade</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: mission control. Full-bleed hero with one countdown, then open bands separated by
   hairline rules; boxes are reserved for things you act on (dates, announcements). */
:root{
  color-scheme: dark;
  --space:#07112A; --space-2:#0B1834; --panel:#10214A; --panel-2:#16295A; --line:#22376B; --rule:#1A2C58;
  --ink:#EEF2FF; --muted:#A3B1D8; --faint:#7183B3;
  --ignite:#FF6B3D; --ignite-2:#FF9A6B; --on-ignite:#1C0802;
  --c-ela:#FF8FB1; --c-social:#F5C451; --c-science:#7EE08F; --c-engineering:#4FD6C8; --c-math:#6FA8FF; --c-accel:#B99BFF;
  --t-test:#FF6B3D; --t-trip:#62E0E8; --t-due:#EEF2FF; --t-off:#A3B1D8; --t-event:#9DB2FF; --t-note:#A3B1D8;
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs-hero:clamp(2.6rem,6vw,4.7rem); --fs-h1:clamp(2.2rem,5vw,3.6rem); --fs-h2:clamp(1.55rem,2.8vw,2.15rem); --fs-h3:1.12rem;
  --radius:16px; --wrap:1160px; --band:clamp(56px,8vw,104px);
}
*{box-sizing:border-box}

body{background:var(--space);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--space)}
a{color:var(--ink)}
::selection{background:var(--ignite);color:var(--on-ignite)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ignite);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);font-stretch:125%;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-weight:850;font-size:var(--fs-h1)}
h2{font-weight:800;font-size:var(--fs-h2)}
h3{font-weight:700;font-size:var(--fs-h3);font-stretch:108%;letter-spacing:0;line-height:1.25}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.band{padding-block:var(--band)}
.band + .band{border-top:1px solid var(--rule)}
.eyebrow{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:inline-flex;gap:10px;align-items:center}
.lede{color:var(--muted);font-size:clamp(1.02rem,1.4vw,1.14rem);max-width:60ch;line-height:1.6}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 28px;margin-bottom:clamp(24px,3vw,36px)}
.sec-head > div{display:grid;gap:10px}
.more{font-family:var(--font-mono);font-size:.84rem;color:var(--ignite-2);text-decoration:none;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.more::after{content:"→";transition:transform .2s}
.more:hover::after{transform:translateX(3px)}
.empty{color:var(--faint);font-style:italic}
.txt p + p{margin-top:.6em}
.txt a{color:var(--ignite-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* motion: one short rise on page change */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.anim .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
/* page-to-page: the old page fades up and out, the new one settles in; the menu pill glides to the new tab */
.topbar{view-transition-name:topbar}
.nav a[aria-current="page"]{view-transition-name:navpill}
::view-transition-old(root){animation:vt-out .22s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vt-in .45s cubic-bezier(.2,.7,.2,1) .05s both}
::view-transition-group(navpill){animation-duration:.4s;animation-timing-function:cubic-bezier(.3,.8,.25,1)}
::view-transition-old(topbar),::view-transition-new(topbar){animation:none}
@keyframes vt-out{to{opacity:0;transform:translateY(-8px);filter:blur(2px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(14px)}}
#app{transition:opacity .16s ease,transform .16s ease}
#app.leaving{opacity:0;transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--space) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:68px;position:relative}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand svg{width:36px;height:36px}
.brand b{font-family:var(--font-display);font-stretch:125%;font-weight:850;font-size:1.06rem;letter-spacing:.02em;line-height:1;display:block}
.brand small{display:block;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.nav{margin-left:auto;display:flex;gap:2px;list-style:none;padding:0;margin-block:0}
.nav a{display:block;padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.94rem;transition:color .15s,background .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.lang button{font:600 .74rem var(--font-mono);letter-spacing:.08em;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ignite);color:var(--on-ignite)}
.menu-btn{display:none;background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 .88rem var(--font-body);cursor:pointer}
@media (max-width:980px){
  .menu-btn{display:block;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--space-2);border-bottom:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px))}
  .nav.open{display:flex}
  .nav a{padding:13px 14px;font-size:1.08rem;border-radius:12px}
}
@media (max-width:460px){.topbar .wrap{gap:8px}.brand{gap:9px}.brand b{font-size:.94rem}.brand small{display:none}.brand svg{width:32px;height:32px}.menu-btn{padding:7px 12px}.lang button{padding:5px 8px}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font:600 .95rem var(--font-body);text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--panel);border-color:var(--muted)}
.btn.primary{background:var(--ignite);border-color:var(--ignite);color:var(--on-ignite)}
.btn.primary:hover{background:var(--ignite-2);border-color:var(--ignite-2)}
.btn.sm{padding:8px 15px;font-size:.88rem}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule);background:radial-gradient(110% 90% at 88% -10%,#132A62 0%,var(--space-2) 40%,var(--space) 75%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--space) 0%,color-mix(in srgb,var(--space) 88%,transparent) 42%,color-mix(in srgb,var(--space) 45%,transparent) 100%),linear-gradient(0deg,var(--space) 0%,transparent 40%)}
.hero .arc{position:absolute;right:-4%;bottom:-34%;width:min(820px,95vw);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center;padding-block:clamp(64px,9vw,128px)}
.hero h1{font-size:var(--fs-hero);font-weight:900;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--ignite)}
.hero .lede{margin-top:22px}
.hero .cta-row{margin-top:32px}
@media (max-width:860px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

.countdown{position:relative;background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3vw,30px);display:grid;gap:14px;box-shadow:0 30px 80px -40px #000}
.countdown .t{font-family:var(--font-display);font-stretch:125%;font-weight:850;font-size:clamp(3rem,6vw,4.4rem);line-height:.95;color:var(--tc,var(--ignite));font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.countdown .t small{font-family:var(--font-mono);font-size:.26em;font-weight:600;color:var(--muted);letter-spacing:.14em;margin-left:10px;vertical-align:.5em}
.countdown h3{font-size:1.35rem;font-stretch:115%}
.countdown .meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.94rem}
.countdown .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}

/* classes / types */
.c-ela{--c:var(--c-ela)} .c-social{--c:var(--c-social)} .c-science{--c:var(--c-science)}
.c-engineering{--c:var(--c-engineering)} .c-math{--c:var(--c-math)} .c-accel{--c:var(--c-accel)}
.cls{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.cls::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.dot-h{display:flex;align-items:center;gap:11px}
.dot-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.ty-test{--tc:var(--t-test)} .ty-trip{--tc:var(--t-trip)} .ty-due{--tc:var(--t-due)} .ty-off{--tc:var(--t-off)} .ty-event{--tc:var(--t-event)} .ty-note{--tc:var(--t-note)}
.type{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap;background:var(--tc);color:var(--space);border:1px solid var(--tc);line-height:1.4}
.type svg{width:12px;height:12px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.type.ty-off{background:var(--space);color:var(--ink);border-color:var(--t-off)}
.type.ty-event,.type.ty-note{background:transparent;color:var(--tc);border-color:color-mix(in srgb,var(--tc) 55%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tag{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px dashed var(--faint);color:var(--muted)}

/* announcements */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .2s,transform .2s}
.note:hover{transform:translateY(-2px)}
.note.ty-test,.note.ty-trip,.note.ty-due{border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}
.note.ty-off{background:repeating-linear-gradient(135deg,var(--panel) 0 12px,var(--space-2) 12px 24px)}
.note h3{font-size:1.14rem;overflow-wrap:anywhere}
.note .txt{color:var(--muted);font-size:.96rem}
.note .foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.note .when{font-family:var(--font-mono);font-size:.8rem;color:var(--ink)}

/* this week list */
.wk-list{border-top:1px solid var(--rule)}
.wk{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 28px;gap:12px 32px;align-items:baseline;padding:22px 8px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);transition:background .2s}
.wk:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,transparent),transparent 70%)}
.wk h3{font-size:1.1rem}
.wk .who{font-size:.86rem;color:var(--muted);margin-top:4px;padding-left:21px}
.wk p{color:var(--muted)}
.wk .go{color:var(--faint);transition:transform .2s,color .2s;font-family:var(--font-mono)}
.wk:hover .go{color:var(--c);transform:translateX(4px)}
.wk-empty{margin-top:16px;font-size:.9rem;color:var(--faint)}
@media (max-width:720px){.wk{grid-template-columns:minmax(0,1fr) 20px}.wk > div:first-child{grid-column:1/-1}.wk p{grid-column:1}}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:24px;position:relative}
.timeline::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:linear-gradient(90deg,var(--ignite),var(--line) 60%)}
.timeline li{position:relative;padding-top:30px;display:grid;gap:8px;align-content:start;min-width:0}
.timeline .node{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 5px var(--space)}
.timeline .ty-off .node{background:var(--space);border:2px solid var(--t-off)}
.timeline .ty-event .node,.timeline .ty-note .node{background:var(--space);border:2px solid var(--tc)}
.timeline .when{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.timeline h3{font-size:1.02rem;overflow-wrap:anywhere}
.timeline .in{font-family:var(--font-mono);font-size:.76rem;color:var(--faint)}
@media (max-width:860px){
  .timeline{grid-template-columns:minmax(0,1fr);gap:22px}
  .timeline::before{left:7px;right:auto;top:6px;bottom:6px;width:2px;height:auto;background:linear-gradient(180deg,var(--ignite),var(--line) 60%)}
  .timeline li{padding-top:0;padding-left:36px}
}

/* teachers */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:28px 20px}
.person{display:grid;gap:4px;align-content:start;min-width:0}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:1.25rem;color:var(--space);background:var(--c,var(--muted));overflow:hidden;margin-bottom:12px;box-shadow:0 0 0 4px var(--space),0 0 0 5px color-mix(in srgb,var(--c,var(--muted)) 50%,transparent)}
.avatar img{width:100%;height:100%;object-fit:cover}
.person .n{font-weight:600;font-size:1.05rem}
.person .s{font-size:.88rem;color:var(--muted)}
.email{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0;flex-wrap:wrap}
.email span{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.copy{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font:500 .7rem var(--font-mono);padding:2px 7px;cursor:pointer}
.copy:hover{color:var(--ink);border-color:var(--muted)}

/* practice */
.feature{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.atom{position:relative;overflow:hidden;background:radial-gradient(120% 120% at 100% 0%,#2A2470 0%,var(--panel-2) 45%,var(--panel) 100%);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:14px}
.atom svg.orbit{position:absolute;right:-50px;top:-50px;width:280px;opacity:.6;pointer-events:none}
.atom h2{position:relative}
.atom p{color:var(--muted);max-width:46ch;position:relative}
.side{border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.side p{color:var(--muted)}
@media (max-width:860px){.feature{grid-template-columns:minmax(0,1fr)}}

/* page head */
.page-head{border-bottom:1px solid var(--rule);background:radial-gradient(90% 140% at 90% -40%,#132A62 0%,var(--space-2) 45%,var(--space) 80%)}
.page-head .wrap{padding-block:clamp(48px,7vw,88px) clamp(40px,5vw,64px);display:grid;gap:16px}
.page-head h1 .accent{color:var(--c,var(--ignite))}

/* updates page */
.upd-block{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,1fr);gap:16px 36px;padding:28px 0;border-bottom:1px solid var(--rule)}
.upd-block:first-child{border-top:1px solid var(--rule)}
.upd-block .who{font-size:.86rem;color:var(--muted);margin-top:4px;padding-left:21px}
.lbl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.upd-block .txt{color:var(--muted)}
@media (max-width:820px){.upd-block{grid-template-columns:minmax(0,1fr)}}

/* class pages */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--c,var(--ignite))}
.tile p{color:var(--muted);font-size:.96rem}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.class-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start}
@media (max-width:880px){.class-layout{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:clamp(28px,4vw,44px)}
.block h2{font-size:1.35rem;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.units{list-style:none;padding:0;margin:0;display:grid;counter-reset:u;border-top:1px solid var(--rule)}
.units li{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--rule)}
.units li::before{counter-increment:u;content:counter(u,decimal-leading-zero);font-family:var(--font-mono);font-size:.8rem;color:var(--c,var(--ignite))}
.units.plain li{grid-template-columns:14px minmax(0,1fr)}
.units.plain li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);transform:translateY(-2px)}
.hl{display:grid;gap:4px;padding-left:16px;border-left:2px solid color-mix(in srgb,var(--c) 50%,transparent)}
.hl p{color:var(--muted);font-size:.96rem}
.aside{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;gap:14px}
.next-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.next-list li{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:12px;align-items:baseline;font-size:.94rem}
.next-list .mono{color:var(--muted);font-size:.84rem}
.res-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.res-list a{display:block;padding:12px 14px;border-radius:12px;background:var(--space-2);border:1px solid var(--line);text-decoration:none;transition:border-color .15s}
.res-list a:hover{border-color:var(--ignite)}
.res-list b{display:block;font-weight:600}
.res-list span{font-size:.86rem;color:var(--muted)}

/* dates page */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{display:inline-flex;align-items:center;gap:8px;font:500 .9rem var(--font-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;transition:color .15s,border-color .15s}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ignite);background:var(--panel)}
.filters button i{font-style:normal;font-family:var(--font-mono);font-size:.76rem;color:var(--faint)}
.filters .sw{width:10px;height:10px;border-radius:3px;background:var(--tc);border:1px solid var(--tc)}
.filters .ty-off .sw{background:repeating-linear-gradient(135deg,var(--t-off) 0 2px,transparent 2px 4px)}
.filters .ty-event .sw,.filters .ty-note .sw{background:transparent}
.dates-top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;margin-bottom:36px}
.month + .month{margin-top:44px}
.month h2{font-size:1.15rem;color:var(--muted);font-stretch:112%;margin-bottom:14px}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.agenda li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.agenda li.ty-off{background:repeating-linear-gradient(135deg,var(--panel) 0 12px,var(--space-2) 12px 24px)}
.agenda li.ty-test,.agenda li.ty-trip,.agenda li.ty-due{border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}
.agenda .when{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);line-height:1.25;letter-spacing:.06em}
.agenda .when b{display:block;color:var(--tc,var(--ink));font-family:var(--font-display);font-stretch:125%;font-size:1.6rem;letter-spacing:-.02em}
.agenda .what{display:grid;gap:6px;min-width:0}
.agenda .what b{font-weight:600;overflow-wrap:anywhere}
.agenda .what p{font-size:.92rem;color:var(--muted)}
.agenda .in{font-family:var(--font-mono);font-size:.78rem;color:var(--faint);white-space:nowrap}
@media (max-width:560px){.agenda li{grid-template-columns:56px minmax(0,1fr)}.agenda .in{grid-column:2}}
.subscribe{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.subscribe span{font-size:.9rem;color:var(--muted);margin-right:4px}

/* gallery + locker */
.gallery{columns:3 260px;column-gap:16px}
.gallery figure{break-inside:avoid;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{padding:12px 14px;display:grid;gap:6px;font-size:.92rem;color:var(--muted)}
.story .art{height:120px;background:var(--space-2);border-bottom:1px solid var(--line);display:block;width:100%}
.story .body{padding:18px;display:grid;gap:8px}
.story .body p{color:var(--muted);font-size:.94rem}
.locker{background:radial-gradient(120% 140% at 100% 0%,#1B2F66 0%,var(--panel) 60%);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,36px);display:grid;gap:18px;margin-bottom:var(--band)}
.locker .head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.locker .head h2{display:flex;align-items:center;gap:12px}
.locker .head svg{width:30px;height:30px;flex-shrink:0}
.unlock{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:580px}
.unlock input{flex:1 1 240px;min-width:0;font:500 1rem var(--font-mono);color:var(--ink);background:var(--space);border:1px solid var(--line);border-radius:999px;padding:12px 18px}
.lock-msg{font-size:.92rem;color:var(--muted);min-height:1.4em}
.lock-msg.err{color:var(--ignite-2)}
.ph-wait{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--space-2) 10px 20px)}
.notice{border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--muted);margin-bottom:28px}

/* loading */
.skel{display:block;height:.85em;border-radius:6px;background:linear-gradient(90deg,var(--panel) 0%,var(--line) 50%,var(--panel) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel + .skel{margin-top:.6em}
.skel.w60{width:60%} .skel.w80{width:80%} .skel.w40{width:40%}
.skel-row{padding:24px 8px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:32px}
@keyframes shimmer{to{background-position:-200% 0}}

/* footer */
footer{border-top:1px solid var(--rule);background:var(--space-2)}
footer .wrap{padding-block:clamp(48px,6vw,72px) 28px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:36px 28px}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot-grid h4{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 14px}
.foot-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.foot-grid a{color:var(--muted);text-decoration:none}
.foot-grid a:hover{color:var(--ink)}
.foot-grid p,.foot-grid li{color:var(--muted);font-size:.94rem}
.foot-grid .k{display:block;font-size:.78rem;color:var(--faint)}
.foot-grid .v{color:var(--ink);font-family:var(--font-mono);font-size:.9rem}
.foot-bottom{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:.84rem;color:var(--faint)}
</style>
</head>

function parseDate(s){
  s = String(s||"").trim(); if(!s) return null; let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/))){
    let y = m[3]? +m[3] : null; if(y!==null && y<100) y+=2000;
    if(y===null){ const fy=fallYear(); y = (+m[1]>=7)?fy:fy+1; }
    return new Date(y,+m[1]-1,+m[2]);
  }
  const d = new Date(s); if(!isNaN(d)){d.setHours(0,0,0,0);return d} return null;
}

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const head = rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  return rows.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}
async function loadTab(name, mustHave){
  const url=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.SHEET_ID)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r = await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(name+": "+r.status);
  const rows = parseCSV(await r.text());
  // Google returns the first tab when a tab name is missing, so check the columns.
  if(rows.length && !mustHave.every(k=>k in rows[0])) return null;
  return rows;
}

/* ---------- Family photo locker (encrypted photos, unlocked with a family code) ---------- */
const LOCK_ICON = '<svg viewBox="0 0 28 28" aria-hidden="true"><rect x="5" y="12" width="18" height="12" rx="3" fill="none" stroke="#FF6B3D" stroke-width="2"/><path d="M9 12V9a5 5 0 0 1 10 0v3" fill="none" stroke="#FF6B3D" stroke-width="2"/><circle cx="14" cy="18" r="1.8" fill="#FF6B3D"/></svg>';
const LOCKER = {K:null, photos:null, urls:{}, msg:"", err:false, busy:false, available:null};
const u8b64 = u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64u8 = s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gcmDecrypt(key,u8){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8.slice(0,12)},key,u8.slice(12))); }
async function fetchBin(path){ const r=await fetch(path,{cache:"no-store"}); if(!r.ok) throw new Error(path+" "+r.status); return new Uint8Array(await r.arrayBuffer()); }
function parseCode(code){
  const m=String(code||"").trim().toLowerCase().match(/^#?(\d+)\D*(.*)$/); if(!m) return null;
  return {n:String(+m[1]), mat:m[2].replace(/[^a-z0-9]/g,"")};
}
async function lockerUnlock(code){
  const c=parseCode(code);
  if(!c||!c.mat){ LOCKER.msg="errFull"; LOCKER.err=true; return; }
  const keys=await (await fetch("locker/keys.json",{cache:"no-store"})).json();
  const e=keys.entries[c.n];
  if(!e){ LOCKER.msg="errInactive"; LOCKER.err=true; return; }
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(c.mat),"PBKDF2",false,["deriveKey"]);
  const wk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64u8(e.s),iterations:keys.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let raw; try{ raw=await gcmDecrypt(wk,b64u8(e.w)); }catch{ LOCKER.msg="errMatch"; LOCKER.err=true; return; }
  LOCKER.K=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  try{ sessionStorage.setItem("stemLocker",u8b64(raw)); }catch{}
  LOCKER.msg=""; LOCKER.err=false;
}
async function lockerLoad(){
  const man=JSON.parse(new TextDecoder().decode(await gcmDecrypt(LOCKER.K,await fetchBin("locker/manifest.bin"))));
  LOCKER.photos=(man.photos||[]).slice().reverse();
  paintLocker();
  for(const p of LOCKER.photos){
    if(LOCKER.urls[p.f]) continue;
    try{ const img=await gcmDecrypt(LOCKER.K,await fetchBin("locker/"+p.f)); LOCKER.urls[p.f]=URL.createObjectURL(new Blob([img],{type:p.t||"image/jpeg"})); }
    catch{ LOCKER.urls[p.f]="x"; }
    paintLocker();
  }
}
async function lockerRestore(){
  if(LOCKER.K) return;
  let saved=null; try{ saved=sessionStorage.getItem("stemLocker"); }catch{}
  if(saved){ try{ LOCKER.K=await crypto.subtle.importKey("raw",b64u8(saved),"AES-GCM",false,["decrypt"]); }catch{} }
}
function lockerHTML(){
  if(LOCKER.available===false) return "";
  const head=`<div class="head"><h2>${LOCK_ICON}${T("famTitle")}</h2>${LOCKER.K?`<button class="btn sm" data-lock="out">${T("lockBtn")}</button>`:""}</div>`;
  if(!LOCKER.K) return `<div class="locker">${head}
    <p style="color:var(--muted);max-width:60ch">${T("famDesc")}</p>
    <form class="unlock" id="unlockForm" autocomplete="off"><label class="sr" for="familyCode">${T("famCode")}</label>
      <input id="familyCode" name="familyCode" placeholder="${T("famPh")}" autocapitalize="off" spellcheck="false">
      <button class="btn primary" type="submit"${LOCKER.busy?" disabled":""}>${LOCKER.busy?T("unlocking"):T("unlock")}</button></form>
    <div class="lock-msg${LOCKER.err?" err":""}" role="status">${LOCKER.msg?esc(T(LOCKER.msg)):""}</div></div>`;
  const ph=LOCKER.photos;
  return `<div class="locker">${head}
    ${ph===null?`<p class="lock-msg">${T("loadingPhotos")}</p>`:!ph.length?`<p class="empty">${T("famNone")}</p>`:
    `<div class="gallery">${ph.map(p=>{const u=LOCKER.urls[p.f];return `<figure>${u&&u!=="x"?`<img src="${u}" alt="${esc(p.caption||T("classPhoto"))}">`:`<div class="ph-wait" aria-label="${T("loadingPhoto")}"></div>`}${p.caption||p.cls?`<figcaption>${clsTag(classKey(p.cls))}<span>${esc(p.caption||"")}</span></figcaption>`:""}</figure>`}).join("")}</div>`}
    <p class="lock-msg">${T("famRepost")}</p></div>`;
}
function paintLocker(){ const el=$("#locker"); if(el) el.innerHTML=lockerHTML(); }
async function lockerInit(){
  if(LOCKER.available===null){
    try{ const r=await fetch("locker/keys.json",{method:"HEAD",cache:"no-store"}); LOCKER.available=r.ok; }catch{ LOCKER.available=false; }
    if(!LOCKER.available){ paintLocker(); return; }
  }
  await lockerRestore();
  if(LOCKER.K && LOCKER.photos===null){ try{ await lockerLoad(); }catch{ LOCKER.K=null; try{sessionStorage.removeItem("stemLocker")}catch{} } }
  paintLocker();
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="unlockForm") return; e.preventDefault();
  const code=e.target.familyCode.value; LOCKER.busy=true; LOCKER.msg=""; paintLocker();
  try{ await lockerUnlock(code); }catch{ LOCKER.msg="errReach"; LOCKER.err=true; }
  LOCKER.busy=false; paintLocker();
  if(LOCKER.K){ try{ await lockerLoad(); }catch{ LOCKER.msg="errLoad"; LOCKER.err=true; LOCKER.K=null; paintLocker(); } }
  else { const i=$("#familyCode"); if(i){ i.value=code; i.focus(); } }
});

/* ---------- router ---------- */
const ROUTES = {home:viewHome,updates:viewUpdates,classes:viewClasses,calendar:viewCalendar,resources:viewResources,gallery:viewGallery};
const TITLES = {updates:"navUpdates",classes:"navClasses",calendar:"navDates",resources:"navResources",gallery:"navGallery"};
function route(){ const h=(location.hash||"#home").slice(1); return (h in ROUTES || h in CLASSES)?h:"home"; }
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T(el.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  $(".lang").setAttribute("aria-label",T("langLbl"));
  $("#footer").innerHTML = footerHTML();
}
function render(animate){
  const r=route(); const app=$("#app");
  app.classList.toggle("anim",!!animate);
  app.innerHTML = r in CLASSES ? viewClass(r) : ROUTES[r]();
  const navKey = r in CLASSES ? "classes" : r;
  document.querySelectorAll(".nav a").forEach(a=>{ if(a.getAttribute("href")==="#"+navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  document.title = (r==="home"?"":(r in CLASSES ? cName(r) : T(TITLES[r]))+" · ")+T("siteTitle");
  if(animate==="scroll") window.scrollTo({top:0,left:0,behavior:"instant"});
  drawStars();
  if(r==="gallery") lockerInit();
}
/* Smooth page changes: the browser's view transitions where supported, a quick fade elsewhere. */
const reduceMotion = ()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function transition(update){
  if(reduceMotion()) return update();
  if(document.startViewTransition){ document.startViewTransition(update); return; }
  const app=$("#app"); app.classList.add("leaving");
  setTimeout(()=>{ update(); requestAnimationFrame(()=>app.classList.remove("leaving")); },160);
}
window.addEventListener("hashchange",()=>{ $("#nav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); transition(()=>render("scroll")); });
$("#menuBtn").addEventListener("click",e=>{const o=$("#nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",String(o))});
document.addEventListener("click",async e=>{
  const lb=e.target.closest("[data-lang]"); if(lb){ if(lb.dataset.lang===LANG) return; LANG=lb.dataset.lang; try{localStorage.setItem("stemLang",LANG)}catch{} transition(()=>{ applyStatic(); render(false); }); return; }
  const f=e.target.closest("[data-filter]"); if(f){ dateFilter=f.dataset.filter; render(false); return; }
  if(e.target.closest("[data-lock]")){ LOCKER.K=null; LOCKER.photos=null; Object.values(LOCKER.urls).forEach(u=>u!=="x"&&URL.revokeObjectURL(u)); LOCKER.urls={}; try{sessionStorage.removeItem("stemLocker")}catch{} paintLocker(); return; }
  const b=e.target.closest(".copy"); if(!b) return;
  const v=b.dataset.copy;
  try{ await navigator.clipboard.writeText(v); b.textContent=T("copied"); }
  catch{ const s=b.previousElementSibling; if(s){const rg=document.createRange();rg.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);} b.textContent=T("selected"); }
  setTimeout(()=>b.textContent=T("copy"),1600);
});

/* ---------- starfield ---------- */
function drawStars(){
  const c=$("#stars"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=r.width*dpr; c.height=r.height*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  let s=42; const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  const n=Math.round(r.width*r.height/4600);
  for(let i=0;i<n;i++){ const a=rnd(); x.fillStyle=a>.95?"rgba(255,154,107,.9)":`rgba(214,224,255,${.15+rnd()*.55})`; x.beginPath(); x.arc(rnd()*r.width,rnd()*r.height,a>.97?1.6:rnd()*1.1+.2,0,7); x.fill(); }
}
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawStars,150)});

bootFromCache();
applyStatic();
render(true);
loadSheet().catch(err=>{ console.warn("Team sheet not loaded:",err); if(DATA.loading){ const preview=/claude/i.test(location.hostname); DATA.loading=false; DATA.dates=preview?exampleDates():[]; DATA.team=preview?exampleTeam():[]; render(false); } });

</script>
